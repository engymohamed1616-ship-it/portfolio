name: organize
on: workflow_dispatch
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p videos
          mv "$(find part1 -name index.html | head -n 1)" index.html
          find part1 part2 part3 part4 part5 part6 -name '*.mp4' -exec mv {} videos/ \;
          rm -rf part1 part2 part3 part4 part5 part6 part1.zip
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Organize site"
          git push
